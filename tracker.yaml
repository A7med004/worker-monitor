# BoT-SORT with appearance features from the detector backbone.
# Sparse optical flow compensates for camera motion.
tracker_type: botsort
track_high_thresh: 0.3
track_low_thresh: 0.1
new_track_thresh: 0.5
track_buffer: 150
match_thresh: 0.85
fuse_score: true
gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: true
model: auto
